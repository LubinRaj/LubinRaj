<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Tools I reach for</title>
  <desc id="description">A working set for agentic AI, product platforms, experience design, and systems delivery.</desc>
  <rect width="1200" height="390" fill="#e4e0d9"/>
  <path d="M48 72H1152" stroke="#10100f" stroke-width="1"/>
  <text x="48" y="52" fill="#2f51ff" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">TOOLS I REACH FOR</text>
  <g font-family="Arial, sans-serif">
    <path d="M600 72V342M48 207H1152" stroke="#a9a69f" stroke-width="1"/>
    <text x="48" y="112" fill="#2f51ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">01 / AGENTIC AI</text>
    <text x="48" y="153" fill="#10100f" font-size="25" font-weight="700" letter-spacing="-1">MCP, Mastra, LLM and SLM applications,</text>
    <text x="48" y="184" fill="#10100f" font-size="25" font-weight="700" letter-spacing="-1">tool calling, context, memory, and evals.</text>

    <text x="632" y="112" fill="#2f51ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">02 / PRODUCT PLATFORM</text>
    <text x="632" y="153" fill="#10100f" font-size="25" font-weight="700" letter-spacing="-1">TypeScript, Next.js, React, Angular,</text>
    <text x="632" y="184" fill="#10100f" font-size="25" font-weight="700" letter-spacing="-1">Hono, NestJS, APIs, and real-time systems.</text>

    <text x="48" y="247" fill="#2f51ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">03 / EXPERIENCE LAYER</text>
    <text x="48" y="288" fill="#10100f" font-size="25" font-weight="700" letter-spacing="-1">Tailwind, Three.js, D3.js, WXT,</text>
    <text x="48" y="319" fill="#10100f" font-size="25" font-weight="700" letter-spacing="-1">Playwright, Puppeteer, and browser tooling.</text>

    <text x="632" y="247" fill="#2f51ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">04 / SYSTEMS + DELIVERY</text>
    <text x="632" y="288" fill="#10100f" font-size="25" font-weight="700" letter-spacing="-1">PostgreSQL, Redis, AWS, Docker, CI/CD,</text>
    <text x="632" y="319" fill="#10100f" font-size="25" font-weight="700" letter-spacing="-1">OAuth, RBAC, TDD, and E2E validation.</text>
  </g>
</svg>
