<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title description">
  <title id="title">The path so far</title>
  <desc id="description">A progression from automation and IoT through product engineering to agentic AI.</desc>
  <rect width="1200" height="290" fill="#10100f"/>
  <text x="48" y="52" fill="#f3f1ed" font-family="Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-1">The path so far.</text>
  <text x="48" y="79" fill="#9f9c95" font-family="Georgia, serif" font-size="17">The problems changed. The desire to understand how things work did not.</text>
  <path d="M48 105H1152" stroke="#4a4945" stroke-width="1"/>
  <g font-family="Arial, sans-serif">
    <text x="48" y="143" fill="#2f51ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">01 / STARTED WITH</text>
    <text x="48" y="188" fill="#f3f1ed" font-size="28" font-weight="700" letter-spacing="-1">Automation + IoT</text>
    <text x="48" y="219" fill="#a9a69f" font-family="Georgia, serif" font-size="17">Control systems, simulation, virtual prototypes.</text>

    <path d="M415 125V235" stroke="#4a4945" stroke-width="1"/>
    <text x="445" y="143" fill="#2f51ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">02 / GREW INTO</text>
    <text x="445" y="188" fill="#f3f1ed" font-size="28" font-weight="700" letter-spacing="-1">Product engineering</text>
    <text x="445" y="219" fill="#a9a69f" font-family="Georgia, serif" font-size="17">Interfaces, APIs, data, cloud, and delivery.</text>

    <path d="M805 125V235" stroke="#4a4945" stroke-width="1"/>
    <text x="835" y="143" fill="#2f51ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">03 / EXPLORING NOW</text>
    <text x="835" y="188" fill="#f3f1ed" font-size="28" font-weight="700" letter-spacing="-1">Agentic AI</text>
    <text x="835" y="219" fill="#a9a69f" font-family="Georgia, serif" font-size="17">MCP, Mastra, context, tools, and evaluation.</text>
  </g>
  <circle cx="1115" cy="280" r="130" fill="none" stroke="#2f51ff" stroke-opacity=".38" stroke-width="2"/>
</svg>
